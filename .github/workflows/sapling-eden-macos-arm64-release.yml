name: Release - Sapling+EdenFS Homebrew macOS-arm64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.1 (defaults to the SAPLING_VERSION file if left empty)'
        required: false
      force:
        description: 'Rebuild and re-publish even if this version already has a release asset'
        type: boolean
        default: false
  push:
    tags:
      - v*
      - test-release-*

env:
  GETDEPS_SCRATCH: ${{ github.workspace }}/../getdeps-scratch
  GETDEPS_JOBS: 3
  PYTHON310: /opt/homebrew/opt/python@3.10/bin/python3.10
  # Parity with the proven-working local recipe (mise.local.toml); untested
  # on a fresh runner image, so may need iteration on the first real run
  # (see the "Budget"/cold-build risk note in the plan).
  OPENSSL_DIR: /opt/homebrew/Cellar/openssl@3

jobs:
  build-and-publish:
    # Pinned rather than macos-latest: the NFS mount code hardcodes an XDR
    # args version that could drift with the macOS SDK/toolchain a newer
    # image ships (see eden-oss-build-notes.md). Bump deliberately, not via
    # a floating label.
    runs-on: macos-15
    timeout-minutes: 360 # plan's Phase 2 budget: 2-4h cold, 6h hard cap
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(cat SAPLING_VERSION)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "ASSET=sapling-eden-${VERSION}-arm64_sequoia.tar.gz" >> "$GITHUB_ENV"

      - name: Skip if already published (unless forced)
        # Same reasoning as the plain sapling workflow: a dispatch run that
        # creates the release also creates the tag, which would otherwise
        # re-trigger this workflow as a pointless rebuild.
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force=true requested; building v${VERSION}."
          elif gh release view "v${VERSION}" --repo lucasingels/sapling \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "Release v${VERSION} already has $ASSET; skipping (dispatch with force=true to rebuild)."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Install Homebrew toolchain
        if: env.SKIP_BUILD != 'true'
        # Matches mise.local.toml's build-eden/build-eden-python tasks, plus
        # the manifests' [homebrew] entries `--allow-system-packages` will
        # satisfy from here instead of building from source (see
        # eden-oss-build-notes.md "Satisfied from Homebrew"). The second line
        # (autoconf/automake/.../sqlite) is every other [homebrew]-backed
        # manifest dep this local machine happens to already have installed
        # (diffed `brew list` against every manifests/*'s [homebrew] section)
        # -- getdeps silently uses those here instead of building from
        # source, so the gap only shows up on a from-scratch machine like
        # this runner. Confirmed the hard way: libffi's bundled 3.4.2
        # aarch64 assembly doesn't assemble on this runner's Xcode 16.4
        # toolchain (invalid CFI advance_loc expression) when getdeps builds
        # it from source instead of using brew's newer libffi.
        run: |
          brew install boost cmake ninja glog gflags googletest libevent \
            libsodium lmdb lz4 openssl@3 python@3.10 python@3.12 re2 snappy \
            xxhash xz zstd fmt zlib cpptoml libgit2 icu4c@78 cython sccache
          brew install autoconf automake bzip2 dwarfutils libffi libtool \
            libusb ncurses pcre2 python-setuptools sqlite
          rustup-init -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache getdeps scratch
        if: env.SKIP_BUILD != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GETDEPS_SCRATCH }}/installed
            ${{ env.GETDEPS_SCRATCH }}/downloads
            ${{ env.GETDEPS_SCRATCH }}/py310-tools
          key: getdeps-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}

      - name: Cache sccache
        if: env.SKIP_BUILD != 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Mozilla.sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}

      - name: Bootstrap py310-tools (Cython/pip/setuptools/wheel/delocate)
        if: env.SKIP_BUILD != 'true'
        # Brew's python@3.10 ships without pip, and Cython must be pinned to
        # 3.2.9: 3.3.0 crashes on thrift/py3/converter.pyx (see
        # eden-oss-build-notes.md "Cython: py310-tools had Cython 3.3.0...").
        # Idempotent-ish: skip if the cache above already has it.
        run: |
          [ -d "$GETDEPS_SCRATCH/py310-tools/Cython" ] && exit 0
          "$PYTHON310" -m ensurepip --user
          "$PYTHON310" -m pip install --target "$GETDEPS_SCRATCH/py310-tools" \
            "Cython==3.2.9" setuptools pip wheel delocate

      - name: Build fbthrift-python (thrift-python + folly-python wheel)
        if: env.SKIP_BUILD != 'true'
        run: |
          env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE \
            PYTHONPATH="$GETDEPS_SCRATCH/py310-tools" \
            PATH="/opt/homebrew/opt/python@3.10/libexec/bin:/opt/homebrew/opt/cython/bin:$PATH" \
            RUSTC_BOOTSTRAP=1 \
            ./build/fbcode_builder/getdeps.py build fbthrift-python \
              --scratch-path "$GETDEPS_SCRATCH" --num-jobs "$GETDEPS_JOBS" \
              --allow-system-packages --no-tests \
              --extra-cmake-defines '{"CMAKE_POLICY_VERSION_MINIMUM": "3.5", "Python3_EXECUTABLE": "/opt/homebrew/opt/python@3.10/bin/python3.10", "CMAKE_C_FLAGS": "-DGLOG_USE_GLOG_EXPORT", "CMAKE_CXX_FLAGS": "-DGLOG_USE_GLOG_EXPORT"}'

      - name: Install the thrift-python runtime into brew python@3.10
        if: env.SKIP_BUILD != 'true'
        # eden's own CMake configure step (next) probes for this; it also
        # makes /opt/homebrew/lib/python3.10/site-packages/{thrift,folly}
        # available for assemble_eden_prefix.sh to bundle-relocate from.
        run: env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE ./build/fbcode_builder/darwin-thrift-python-runtime.sh

      - name: Build eden
        if: env.SKIP_BUILD != 'true'
        run: |
          env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE \
            Python3_EXECUTABLE="$PYTHON310" \
            RUSTC_BOOTSTRAP=1 \
            ./build/fbcode_builder/getdeps.py build eden \
              --scratch-path "$GETDEPS_SCRATCH" --num-jobs "$GETDEPS_JOBS" \
              --allow-system-packages --no-tests \
              --src-dir=. --src-dir=sapling:. \
              --extra-cmake-defines '{"CMAKE_POLICY_VERSION_MINIMUM": "3.5", "BUILD_TESTS": "OFF"}'

      - name: Build eden-enabled sl
        if: env.SKIP_BUILD != 'true'
        # The eden manifest only depends on sapling when tests are on, so
        # build-eden above does not produce sl; build it separately into the
        # same scratch (fb303/fbthrift/rust-shed etc. are already built).
        run: |
          env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE \
            RUSTC_BOOTSTRAP=1 \
            ./build/fbcode_builder/getdeps.py build sapling \
              --scratch-path "$GETDEPS_SCRATCH" --num-jobs "$GETDEPS_JOBS" \
              --allow-system-packages --no-tests \
              --src-dir=. \
              --extra-cmake-defines '{"CMAKE_POLICY_VERSION_MINIMUM": "3.5"}'

      - name: Assemble + package
        if: env.SKIP_BUILD != 'true'
        run: |
          ./eden/scm/packaging/mac/assemble_eden_prefix.sh ./stage/sapling-eden
          tar czf "$ASSET" -C ./stage/sapling-eden .
          shasum -a 256 "$ASSET"

      - name: Publish release asset
        if: env.SKIP_BUILD != 'true'
        run: |
          gh release create "v${VERSION}" \
            --repo lucasingels/sapling \
            --title "Sapling+EdenFS v${VERSION}" \
            --generate-notes \
            "$ASSET" \
            2>/dev/null || \
          gh release upload "v${VERSION}" \
            --repo lucasingels/sapling \
            --clobber \
            "$ASSET"

      - name: Push formula to the tap
        if: env.SKIP_BUILD != 'true'
        run: |
          RELEASE_URL="https://github.com/lucasingels/sapling/releases/download/v${VERSION}/${ASSET}"
          brew tap lucasingels/tap "https://x-access-token:${GH_TOKEN}@github.com/lucasingels/homebrew-tap" 2>/dev/null || true
          ./eden/scm/packaging/mac/prepare_formula_eden.py \
            -r "$VERSION" \
            -u "$RELEASE_URL" \
            -t "$ASSET" \
            -o "$(brew --repository lucasingels/tap)/Formula/sapling-eden.rb"
          cd "$(brew --repository lucasingels/tap)"
          git add Formula/sapling-eden.rb
          git commit -m "sapling-eden ${VERSION}"
          git push

      - name: Summary
        if: env.SKIP_BUILD != 'true'
        run: |
          echo "Published $ASSET and lucasingels/tap/sapling-eden ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
