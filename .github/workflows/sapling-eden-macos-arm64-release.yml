name: Release - Sapling+EdenFS Homebrew macOS-arm64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.1 (defaults to the SAPLING_VERSION file if left empty)'
        required: false
      force:
        description: 'Rebuild and re-publish even if this version already has a release asset'
        type: boolean
        default: false
  # Deliberately not on v* tags: a plain `sl` release must not start the
  # multi-hour EdenFS build. Run it by hand or push an eden-test-* tag.
  push:
    tags:
      - eden-test-*

env:
  GETDEPS_JOBS: 3
  PYTHON310: /opt/homebrew/opt/python@3.10/bin/python3.10
  # The Rust openssl crate needs OPENSSL_DIR specifically (docs.rs/openssl);
  # getdeps only sets OPENSSL_ROOT_DIR (for CMake's find_package(OpenSSL),
  # which is why eden's own CMake build finds system openssl fine without
  # any of this). Must be the opt/ prefix symlink, which actually has
  # include/ and lib/ directly inside it -- mise.local.toml's
  # Cellar/openssl@3 (no version) is just the parent of version-numbered
  # subdirectories, not a real install root, so openssl-sys correctly
  # rejects it and falls back to (and on this runner, fails at) vendoring
  # OpenSSL from source. Matches eden/scm/packaging/mac/brew_formula.rb's
  # already-proven `Formula["openssl@3"].opt_prefix`.
  OPENSSL_DIR: /opt/homebrew/opt/openssl@3
  # openssl-sys silently fell back to vendoring anyway even with OPENSSL_DIR
  # correctly set (confirmed from the build log: its build script never even
  # printed an OPENSSL_DIR check, only OPENSSL_NO_VENDOR -- something in the
  # eden/sl_oss feature graph likely unifies in a `vendored` feature request
  # that skips system-library detection outright), and the vendored build
  # then failed on this runner ("make[1]: /bin/sh: Bad file descriptor" in
  # `make depend`, a known macOS/BSD-make jobserver-FD quirk, unrelated to
  # OPENSSL_DIR). OPENSSL_NO_VENDOR=1 forces openssl-sys to actually use
  # OPENSSL_DIR and error out clearly if it can't, instead of silently
  # vendoring and failing on something else entirely.
  OPENSSL_NO_VENDOR: "1"
  # rust-shed's Cargo workspace has an optional/dev crate (audio_streams, a
  # Chromium crosvm dependency eden doesn't need) that pulls in a
  # chromium.googlesource.com git submodule; getdeps hardcodes `cargo build
  # --workspace` with no way to scope that out (getdeps/cargo.py run_cargo).
  # Failed identically twice with "SecureTransport error: connection closed
  # via error" fetching it -- libgit2's macOS TLS backend has a known flaky
  # history with certain git hosts. Cargo's own error message suggests the
  # fix: use the system git CLI (curl-based TLS) instead of libgit2 for git
  # dependency fetches.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build-and-publish:
    # Pinned rather than macos-latest: the NFS mount code hardcodes an XDR
    # args version that could drift with the macOS SDK/toolchain a newer
    # image ships (see eden-oss-build-notes.md). Bump deliberately, not via
    # a floating label.
    runs-on: macos-15
    timeout-minutes: 360 # plan's Phase 2 budget: 2-4h cold, 6h hard cap
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        # GETDEPS_SCRATCH is computed here (not a plain env: value) because
        # the runner context (needed for an absolute, outside-the-checkout
        # path) isn't available in the workflow- or job-level env: block at
        # all -- only inside step contexts -- confirmed the hard way when an
        # earlier version of this file using `${{ runner.temp }}` in env:
        # failed GitHub's own workflow-file validation outright, with zero
        # jobs ever scheduled. $RUNNER_TEMP is the equivalent plain shell
        # env var, always set within run: steps, so no expression needed.
        # Must be an absolute path with no .. segments regardless:
        # actions/cache's glob matcher rejects relative pathing outright
        # ("Invalid pattern ... Relative pathing '.' and '..' is not
        # allowed"), which is what silently no-op'd both "Restore getdeps
        # scratch cache" and "Save getdeps scratch cache" on every run
        # before this fix -- 0 files ever matched, so every run rebuilt
        # from scratch regardless of what got cached.
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(cat SAPLING_VERSION)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "ASSET=sapling-eden-${VERSION}-arm64_sequoia.tar.gz" >> "$GITHUB_ENV"
          echo "GETDEPS_SCRATCH=$RUNNER_TEMP/getdeps-scratch" >> "$GITHUB_ENV"

      - name: Skip if already published (unless forced)
        # Same reasoning as the plain sapling workflow: a dispatch run that
        # creates the release also creates the tag, which would otherwise
        # re-trigger this workflow as a pointless rebuild.
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force=true requested; building v${VERSION}."
          elif gh release view "v${VERSION}" --repo lucasingels/sapling \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "Release v${VERSION} already has $ASSET; skipping (dispatch with force=true to rebuild)."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Install Homebrew toolchain
        if: env.SKIP_BUILD != 'true'
        # Matches mise.local.toml's build-eden/build-eden-python tasks, plus
        # the manifests' [homebrew] entries `--allow-system-packages` will
        # satisfy from here instead of building from source (see
        # eden-oss-build-notes.md "Satisfied from Homebrew"). The second line
        # (autoconf/automake/.../sqlite) is every other [homebrew]-backed
        # manifest dep this local machine happens to already have installed
        # (diffed `brew list` against every manifests/*'s [homebrew] section)
        # -- getdeps silently uses those here instead of building from
        # source, so the gap only shows up on a from-scratch machine like
        # this runner. Confirmed the hard way: libffi's bundled 3.4.2
        # aarch64 assembly doesn't assemble on this runner's Xcode 16.4
        # toolchain (invalid CFI advance_loc expression) when getdeps builds
        # it from source instead of using brew's newer libffi.
        run: |
          brew install boost cmake ninja glog gflags googletest libevent \
            libsodium lmdb lz4 openssl@3 python@3.10 python@3.12 re2 snappy \
            xxhash xz zstd fmt zlib cpptoml libgit2 icu4c@78 cython sccache
          brew install autoconf automake bzip2 dwarfutils libffi libtool \
            libusb ncurses pcre2 python-setuptools sqlite
          rustup-init -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Split restore/save (rather than the combined actions/cache) because
      # getdeps.py itself is what makes a warm cache useful: each project it
      # builds gets a .built-by-getdeps marker under
      # $GETDEPS_SCRATCH/installed/<project>, and it skips rebuilding any
      # project whose marker still matches. fbthrift-python and eden share
      # most of that dependency graph (folly, fbthrift, fb303, wangle,
      # fizz, mvfst, ...), so restoring it lets *both* "Build fbthrift-python"
      # and "Build eden" skip everything already built, no matter which one
      # (if either) fails partway. The combined actions/cache action only
      # saves in its own post-step, and on this workflow's first two runs
      # that post-step did not run when a later step failed -- observed
      # directly as "Post Cache ..." showing skipped, not completed, on both
      # failed runs -- so two consecutive cold builds redid the ~1h
      # fbthrift-python step from zero for no reason. save-with-always()
      # below is the actual fix: it runs during job cleanup regardless of
      # what failed, so the *next* retry after any failure starts from
      # wherever this one got to, not from scratch again.
      # Cache keys end in the run id, not just the manifests/patches hash:
      # GitHub Actions caches are immutable per key (a second save under a
      # key that already exists just fails, "another job may be creating
      # this cache" or similar), so a static key lets exactly one run ever
      # win the save and every later run -- even one that gets much
      # further -- can never supersede it. Ending the key in ${{
      # github.run_id }} (stable across re-runs of the *same* run, unique
      # across different runs) means save always succeeds, and restore-keys
      # below (a prefix match) always resolves to whichever run most
      # recently saved one -- i.e. the most complete cache seen so far, not
      # whichever happened to save first.
      # The single extra build/ path below is a deliberate, narrow exception
      # to "only cache installed/": getdeps' marker check (getdeps/cli.py
      # BuildCmd) looks only at installed/<project>/.built-by-getdeps and
      # skips the whole build step -- including regenerating build/ -- the
      # moment that marker matches, regardless of whether build/ actually
      # exists. edenfsctl.real's full package tree (thrift-python/folly-python
      # bindings, etc.) is a build-tree-only artifact: eden/fs/cli/CMakeLists.txt's
      # install_fb_python_executable() only installs a single launcher file
      # into installed/eden/bin/, never the directory assemble_eden_prefix.sh
      # actually needs. Without caching it explicitly, a fresh runner that
      # restores installed/eden (marker intact) would have getdeps silently
      # skip rebuilding eden, permanently leaving build/eden/.../edenfsctl.real
      # missing and "Assemble + package" failing its precondition check on
      # every future retry -- confirmed by reading both getdeps/cli.py's skip
      # logic and the CMake install() rule before this ever bit us. 8.9 MB
      # locally, so caching it outright is cheap; the rest of build/ (full
      # C++ object trees for the whole dependency graph) is not cached on
      # purpose -- it would balloon cache size/restore time for no benefit,
      # since every other project's real output lives under installed/.
      - name: Restore getdeps scratch cache
        if: env.SKIP_BUILD != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.GETDEPS_SCRATCH }}/installed
            ${{ env.GETDEPS_SCRATCH }}/downloads
            ${{ env.GETDEPS_SCRATCH }}/py310-tools
            ${{ env.GETDEPS_SCRATCH }}/build/eden/eden/fs/cli/edenfsctl.real
          key: getdeps-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            getdeps-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}-

      - name: Restore sccache
        if: env.SKIP_BUILD != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Mozilla.sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}-

      - name: Bootstrap py310-tools (Cython/pip/setuptools/wheel/delocate)
        if: env.SKIP_BUILD != 'true'
        # Brew's python@3.10 ships without pip, and Cython must be pinned to
        # 3.2.9: 3.3.0 crashes on thrift/py3/converter.pyx (see
        # eden-oss-build-notes.md "Cython: py310-tools had Cython 3.3.0...").
        # Idempotent-ish: skip if the cache above already has it.
        run: |
          [ -d "$GETDEPS_SCRATCH/py310-tools/Cython" ] && exit 0
          "$PYTHON310" -m ensurepip --user
          "$PYTHON310" -m pip install --target "$GETDEPS_SCRATCH/py310-tools" \
            "Cython==3.2.9" setuptools pip wheel delocate

      - name: Build fbthrift-python (thrift-python + folly-python wheel)
        if: env.SKIP_BUILD != 'true'
        run: |
          env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE \
            PYTHONPATH="$GETDEPS_SCRATCH/py310-tools" \
            PATH="/opt/homebrew/opt/python@3.10/libexec/bin:/opt/homebrew/opt/cython/bin:$PATH" \
            RUSTC_BOOTSTRAP=1 \
            ./build/fbcode_builder/getdeps.py build fbthrift-python \
              --scratch-path "$GETDEPS_SCRATCH" --num-jobs "$GETDEPS_JOBS" \
              --allow-system-packages --no-tests \
              --extra-cmake-defines '{"CMAKE_POLICY_VERSION_MINIMUM": "3.5", "Python3_EXECUTABLE": "/opt/homebrew/opt/python@3.10/bin/python3.10", "CMAKE_C_FLAGS": "-DGLOG_USE_GLOG_EXPORT", "CMAKE_CXX_FLAGS": "-DGLOG_USE_GLOG_EXPORT"}'

      - name: Install the thrift-python runtime into brew python@3.10
        if: env.SKIP_BUILD != 'true'
        # eden's own CMake configure step (next) probes for this; it also
        # makes /opt/homebrew/lib/python3.10/site-packages/{thrift,folly}
        # available for assemble_eden_prefix.sh to bundle-relocate from.
        run: env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE ./build/fbcode_builder/darwin-thrift-python-runtime.sh

      - name: Build eden
        if: env.SKIP_BUILD != 'true'
        run: |
          env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE \
            Python3_EXECUTABLE="$PYTHON310" \
            RUSTC_BOOTSTRAP=1 \
            ./build/fbcode_builder/getdeps.py build eden \
              --scratch-path "$GETDEPS_SCRATCH" --num-jobs "$GETDEPS_JOBS" \
              --allow-system-packages --no-tests \
              --src-dir=. --src-dir=sapling:. \
              --extra-cmake-defines '{"CMAKE_POLICY_VERSION_MINIMUM": "3.5", "BUILD_TESTS": "OFF"}'

      - name: Build eden-enabled sl
        if: env.SKIP_BUILD != 'true'
        # The eden manifest only depends on sapling when tests are on, so
        # build-eden above does not produce sl; build it separately into the
        # same scratch (fb303/fbthrift/rust-shed etc. are already built).
        run: |
          env -u PYTHON -u PYTHON3 -u PYTHON_SYS_EXECUTABLE \
            RUSTC_BOOTSTRAP=1 \
            ./build/fbcode_builder/getdeps.py build sapling \
              --scratch-path "$GETDEPS_SCRATCH" --num-jobs "$GETDEPS_JOBS" \
              --allow-system-packages --no-tests \
              --src-dir=. \
              --extra-cmake-defines '{"CMAKE_POLICY_VERSION_MINIMUM": "3.5"}'

      - name: Assemble + package
        if: env.SKIP_BUILD != 'true'
        run: |
          ./eden/scm/packaging/mac/assemble_eden_prefix.sh ./stage/sapling-eden
          tar czf "$ASSET" -C ./stage/sapling-eden .
          shasum -a 256 "$ASSET"

      - name: Publish release asset
        if: env.SKIP_BUILD != 'true'
        run: |
          gh release create "v${VERSION}" \
            --repo lucasingels/sapling \
            --title "Sapling+EdenFS v${VERSION}" \
            --generate-notes \
            "$ASSET" \
            2>/dev/null || \
          gh release upload "v${VERSION}" \
            --repo lucasingels/sapling \
            --clobber \
            "$ASSET"

      # Deliberately its own check, separate from "Skip if already
      # published" above: that one only says the release *asset* exists,
      # not that the tap formula was successfully updated to point at it --
      # these failed independently once (prepare_formula_eden.py lacked
      # +x, so this step 404'd with "Permission denied" after the asset had
      # already published successfully). Conflating the two meant the only
      # way to retry this step was workflow_dispatch force=true, which
      # redundantly redid the entire ~3h build for a one-line script-
      # permission fix. This runs unconditionally (not gated on
      # SKIP_BUILD) so it works whether or not the build ran this job.
      - name: Skip formula push if the tap is already at this version
        run: |
          brew tap lucasingels/tap "https://x-access-token:${GH_TOKEN}@github.com/lucasingels/homebrew-tap" 2>/dev/null || true
          FORMULA="$(brew --repository lucasingels/tap)/Formula/sapling-eden.rb"
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ -f "$FORMULA" ] && grep -qx "  version \"${VERSION}\"" "$FORMULA"; then
            echo "Tap formula already at v${VERSION}; skipping (dispatch with force=true to redo)."
            echo "SKIP_FORMULA=true" >> "$GITHUB_ENV"
          fi

      - name: Push formula to the tap
        if: env.SKIP_FORMULA != 'true'
        run: |
          RELEASE_URL="https://github.com/lucasingels/sapling/releases/download/v${VERSION}/${ASSET}"
          # Fetch the tarball fresh rather than assume "Assemble + package"
          # just produced it in this workspace: this step is gated on
          # SKIP_FORMULA now, not SKIP_BUILD, so it must work standalone on
          # a run where the build was skipped entirely.
          [ -f "$ASSET" ] || gh release download "v${VERSION}" --repo lucasingels/sapling --pattern "$ASSET" --clobber
          ./eden/scm/packaging/mac/prepare_formula_eden.py \
            -r "$VERSION" \
            -u "$RELEASE_URL" \
            -t "$ASSET" \
            -o "$(brew --repository lucasingels/tap)/Formula/sapling-eden.rb"
          cd "$(brew --repository lucasingels/tap)"
          git add Formula/sapling-eden.rb
          git commit -m "sapling-eden ${VERSION}"
          git push

      - name: Summary
        if: env.SKIP_FORMULA != 'true'
        run: |
          echo "Published $ASSET and lucasingels/tap/sapling-eden ${VERSION}." >> "$GITHUB_STEP_SUMMARY"

      # if: always() is the actual point of the restore/save split above: run
      # these even when an earlier step failed, so whatever getdeps finished
      # building survives into the next retry instead of starting cold again.
      # The run-id-suffixed key (see the Restore steps' comment) means this
      # always succeeds instead of colliding with an earlier run's save.
      - name: Save getdeps scratch cache
        if: always() && env.SKIP_BUILD != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.GETDEPS_SCRATCH }}/installed
            ${{ env.GETDEPS_SCRATCH }}/downloads
            ${{ env.GETDEPS_SCRATCH }}/py310-tools
            ${{ env.GETDEPS_SCRATCH }}/build/eden/eden/fs/cli/edenfsctl.real
          key: getdeps-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}-${{ github.run_id }}

      - name: Save sccache
        if: always() && env.SKIP_BUILD != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Mozilla.sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('build/fbcode_builder/manifests/**', 'build/fbcode_builder/patches/**') }}-${{ github.run_id }}
