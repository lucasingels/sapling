name: Release - VS Code Extension
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (defaults to the VSCODE_VERSION file)'
        required: false
      force:
        description: 'Rebuild and re-publish even if this version already has a .vsix'
        type: boolean
        default: false
  # Releasing on a push to main, rather than on a tag, matches the sl release
  # workflow: GitHub scopes the Actions cache by ref and prefixes it with
  # `refs/heads/`, so a tag push gets a private scope no later run can read.
  # VSCODE_VERSION is the extension's counterpart to SAPLING_VERSION, so a bump
  # to it is the release trigger. The release itself creates the tag.
  push:
    branches:
      - main
    paths:
      - VSCODE_VERSION

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Releasing to this same repo, so the default token is enough (no PAT).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: yarn
        cache-dependency-path: addons/yarn.lock
    - name: Enable Corepack (yarn)
      run: corepack enable
    - name: Resolve version
      run: |
        # A push to main is triggered by VSCODE_VERSION itself, so the file is
        # the version. A dispatch may name one explicitly.
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="$(cat VSCODE_VERSION)"
        fi
        VERSION="${VERSION#v}"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "TAG=extension-v${VERSION}" >> "$GITHUB_ENV"
        # A versioned filename, so a downloaded .vsix is identifiable. Nothing
        # needs a fixed name: vscode.sh resolves the newest extension-v*
        # release through the API and reads the asset URL from it.
        echo "VSIX=sapling-scm-${VERSION}.vsix" >> "$GITHUB_ENV"
    - name: Check package.json agrees
      # vsce takes the version from package.json, so a disagreement would ship a
      # .vsix whose version contradicts the release it is attached to. Bump both
      # in the same commit.
      run: |
        PKG=$(node -p "require('./addons/vscode/package.json').version")
        if [ "$PKG" != "$VERSION" ]; then
          echo "VSCODE_VERSION says ${VERSION} but addons/vscode/package.json says ${PKG}." >&2
          exit 1
        fi
    - name: Skip if already published (unless forced)
      # So re-running the workflow, or a push that touches VSCODE_VERSION
      # without changing it, does not rebuild and re-publish.
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          echo "force=true requested; building v${VERSION}."
        elif gh release view "$TAG" --repo lucasingels/sapling \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.vsix$'; then
          echo "Release ${TAG} already has a .vsix; skipping (dispatch with force=true to rebuild)."
          echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
        fi
    - name: Install dependencies
      if: env.SKIP_BUILD != 'true'
      working-directory: ./addons
      run: yarn install --frozen-lockfile
    - name: Package extension (.vsix)
      if: env.SKIP_BUILD != 'true'
      # vsce runs the `vscode:prepublish` script (buildForPublish.js), which does
      # the production extension + webview build. --no-dependencies because the
      # bundle is self-contained (node_modules is excluded via .vscodeignore).
      working-directory: ./addons/vscode
      run: npx --yes @vscode/vsce package --no-dependencies -o "$VSIX"
    - name: Publish the versioned release
      if: env.SKIP_BUILD != 'true'
      working-directory: ./addons/vscode
      run: |
        gh release create "$TAG" \
          --repo lucasingels/sapling \
          --target "$GITHUB_SHA" \
          --title "Sapling ISL VS Code Extension v${VERSION}" \
          --notes "Sapling ISL VS Code extension v${VERSION}.

        Install or update:

            curl -fsSL https://raw.githubusercontent.com/lucasingels/sapling/main/vscode.sh | sh" \
          "$VSIX" 2>/dev/null || \
        gh release upload "$TAG" --repo lucasingels/sapling --clobber "$VSIX"
