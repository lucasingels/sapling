name: Release - Homebrew macOS-arm64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.1 (defaults to the SAPLING_VERSION file if left empty)'
        required: false
  push:
    tags:
      - v*
      - test-release-*

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Set version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ] && [ "${{ github.event_name }}" = "push" ]; then
          VERSION="${{ github.ref_name }}"
        fi
        VERSION="${VERSION#v}"
        # Fall back to the SAPLING_VERSION file when dispatched without a version.
        if [ -z "$VERSION" ]; then
          VERSION="$(cat SAPLING_VERSION)"
        fi
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
    - name: Build bottle
      run: eden/scm/packaging/mac/build_bottle.sh "$VERSION"
