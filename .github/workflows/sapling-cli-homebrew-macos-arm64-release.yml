name: Release - Homebrew macOS-arm64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.1 (defaults to the SAPLING_VERSION file if left empty)'
        required: false
      force:
        description: 'Rebuild and re-publish even if this version already has a bottle'
        type: boolean
        default: false
  push:
    tags:
      - v*
      - test-release-*

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Set version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ] && [ "${{ github.event_name }}" = "push" ]; then
          VERSION="${{ github.ref_name }}"
        fi
        VERSION="${VERSION#v}"
        # Fall back to the SAPLING_VERSION file when dispatched without a version.
        if [ -z "$VERSION" ]; then
          VERSION="$(cat SAPLING_VERSION)"
        fi
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
    - name: Skip if already published (unless forced)
      # Creating the release from a dispatch run also creates the tag, which fires
      # this workflow again as a tag push; that self-triggered run would rebuild
      # pointlessly. Skip when the release already has a bottle asset. Pass
      # force=true on manual dispatch to rebuild/re-publish an existing version
      # anyway (e.g. to replace a bad bottle).
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          echo "force=true requested; building v${VERSION}."
        elif gh release view "v${VERSION}" --repo lucasingels/sapling \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.bottle\.tar\.gz$'; then
          echo "Release v${VERSION} already has a bottle asset; skipping (dispatch with force=true to rebuild)."
          echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
        fi
    - name: Build bottle
      if: env.SKIP_BUILD != 'true'
      run: eden/scm/packaging/mac/build_bottle.sh "$VERSION"
