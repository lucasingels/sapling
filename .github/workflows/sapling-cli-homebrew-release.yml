name: Release - Homebrew
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.1 (defaults to the SAPLING_VERSION file if left empty)'
        required: false
      force:
        description: 'Rebuild and re-publish even if this version already has a bottle'
        type: boolean
        default: false
  # Releasing on a push to main, rather than on a tag, is deliberate: GitHub
  # scopes the Actions cache by ref and prefixes it with `refs/heads/`, so a tag
  # push gets a private scope named `refs/heads/refs/tags/v1.2.3` that no later
  # run can read. Every tagged release therefore started from a cold cache and
  # threw its own away. Runs on the default branch share one scope, so the
  # compile caches actually carry over. The release itself creates the tag.
  push:
    branches:
      - main
    paths:
      - SAPLING_VERSION

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v7
    - name: Set version
      run: |
        # A push to main is triggered by SAPLING_VERSION itself, so the file is
        # the version. A dispatch may name one explicitly.
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="$(cat SAPLING_VERSION)"
        fi
        VERSION="${VERSION#v}"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
    - name: Skip if already published (unless forced)
      # Skip when the release already has a bottle asset, so re-running the
      # workflow, or a push that touches SAPLING_VERSION without changing it,
      # does not rebuild and re-publish. Pass force=true on manual dispatch to
      # rebuild an existing version anyway (e.g. to replace a bad bottle).
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          echo "force=true requested; building v${VERSION}."
        elif gh release view "v${VERSION}" --repo lucasingels/sapling \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.bottle\.tar\.gz$'; then
          echo "Release v${VERSION} already has a bottle asset; skipping (dispatch with force=true to rebuild)."
          echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
        fi

    # Nearly all of this job's time is the cargo build inside `brew install`.
    # Three caches carry work between runs:
    #   * sccache (GitHub Actions cache backend) skips recompiling crates whose
    #     inputs are unchanged. Crates from the cargo registry hit across runs
    #     because Homebrew keeps CARGO_HOME at a fixed path under `brew --cache`;
    #     the fork's own workspace crates rebuild every time because Homebrew
    #     unpacks the source into a differently named temp dir on each run.
    #   * the cargo registry (crate index + downloaded .crate files), so a warm
    #     run does not re-download ~800 crates.
    #   * the yarn cache used by the ISL build.
    # The last two live under `brew --cache` because Homebrew's build sandbox
    # only lets package managers write there (Library/Homebrew/package_manager_cache.rb
    # sets CARGO_HOME and YARN_CACHE_FOLDER to those directories).
    - name: Locate the Homebrew cache
      if: env.SKIP_BUILD != 'true'
      run: echo "BREW_CACHE=$(brew --cache)" >> "$GITHUB_ENV"
    - name: Restore the cargo registry
      if: env.SKIP_BUILD != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ${{ env.BREW_CACHE }}/cargo_cache/registry/index
          ${{ env.BREW_CACHE }}/cargo_cache/registry/cache
        # Not Cargo.lock: it is gitignored (eden/scm/.gitignore) and so never
        # checked out, which made hashFiles return empty and the key a constant
        # that actions/cache would never overwrite once saved, leaving the
        # registry frozen at whatever the first run downloaded.
        key: ${{ runner.os }}-${{ runner.arch }}-brew-cargo-registry-${{ hashFiles('eden/scm/**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-brew-cargo-registry-
    - name: Restore the yarn cache
      if: env.SKIP_BUILD != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ env.BREW_CACHE }}/yarn_cache
        key: ${{ runner.os }}-${{ runner.arch }}-brew-yarn-${{ hashFiles('addons/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-brew-yarn-
    - name: Set up sccache
      if: env.SKIP_BUILD != 'true'
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"
    - name: Start the sccache server
      if: env.SKIP_BUILD != 'true'
      # Homebrew scrubs the environment before running a formula, so a server
      # started lazily by the first rustc call inside the build would not see the
      # GitHub Actions cache credentials (ACTIONS_RESULTS_URL/ACTIONS_RUNTIME_TOKEN)
      # and would fall back to a local disk cache the sandbox cannot write to.
      # Start it here with the full environment; the sandboxed compiles only
      # need to reach it on localhost. The idle timeout is disabled because the
      # dependency install and rustup steps run before the first compile.
      env:
        SCCACHE_IDLE_TIMEOUT: "0"
      run: sccache --start-server
    - name: Build bottle
      if: env.SKIP_BUILD != 'true'
      env:
        # HOMEBREW_* is the only prefix Homebrew passes through to the formula;
        # brew_formula.rb wraps rustc with this binary when it is set.
        HOMEBREW_SAPLING_SCCACHE: ${{ env.SCCACHE_PATH }}
      run: eden/scm/packaging/mac/build_bottle.sh "$VERSION"
    - name: Show sccache stats
      if: always() && env.SKIP_BUILD != 'true' && env.SCCACHE_PATH != ''
      run: sccache --show-stats
