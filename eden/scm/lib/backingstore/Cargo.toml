# @generated by autocargo from //eden/scm/lib/backingstore:backingstore

[package]
name = "sapling-backingstore"
version = "0.1.0"
authors = ["Meta Source Control Team <sourcecontrol-dev@meta.com>"]
edition = "2024"
homepage = "https://sapling-scm.com/"
repository = "https://github.com/facebook/sapling"
license = "MIT"

[lib]
name = "backingstore"
crate-type = ["lib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
# Direct dep only to force the "pure" (Rust-only) implementation via feature
# unification: the crate's vendored C objects otherwise duplicate the
# libblake3.a symbols when both are linked into edenfs.
blake3 = { version = "1.8.2", features = ["pure"] }
arc-swap = { version = "1.9.2", features = ["weak"] }
blob = { version = "0.1.0", path = "../blob" }
cxx = "1.0.194"
cxxerror = { version = "0.1.0", path = "../edenfs_ffi/cxxerror" }
env_logger = { version = "0.11.11", features = ["color"] }
flume = "0.11.1"
log = { version = "0.4.33", features = ["kv_unstable", "kv_unstable_std"] }
parking_lot = { version = "0.12.1", features = ["arc_lock", "send_guard"] }
sapling-configloader = { version = "0.1.0", path = "../config/loader" }
# "git" registers the git commit-graph and git object-store constructors, which
# EdenFS needs to serve a `sl clone --git` (git-store) backing repo; without it
# factory::call_constructor falls back to the hg store and every commit is
# "cannot be found". The sl binary enables the same feature via lib/commands.
sapling-constructors = { version = "0.1.0", path = "../constructors", default-features = false, features = ["git"] }
sapling-eagerepo = { version = "0.1.0", path = "../eagerepo" }
sapling-edenapi = { version = "0.1.0", path = "../edenapi" }
sapling-http-client = { version = "0.1.0", path = "../http-client" }
sapling-identity = { version = "0.1.0", path = "../identity" }
sapling-indexedlog = { version = "0.1.0", path = "../indexedlog", features = ["configurable"] }
sapling-manifest = { version = "0.1.0", path = "../manifest" }
sapling-manifest-tree = { version = "0.1.0", path = "../manifest-tree" }
sapling-metrics = { version = "0.1.0", path = "../metrics" }
sapling-pathmatcher = { version = "0.1.0", path = "../pathmatcher" }
sapling-progress-model = { version = "0.1.0", path = "../progress/model" }
sapling-repo = { version = "0.1.0", path = "../repo", features = ["wdir"] }
sapling-revisionstore = { version = "0.1.0", path = "../revisionstore" }
sapling-storemodel = { version = "0.1.0", path = "../storemodel" }
sapling-testutil = { version = "0.1.0", path = "../util/testutil" }
sapling-types = { version = "0.1.0", path = "../types" }
sapling-walkdetector = { version = "0.1.0", path = "../walkdetector" }
smallvec = { version = "1.15.2", default-features = false }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }

[dev-dependencies]
http = "1.5.0"
rand_chacha = "0.10"
url = "2.5.8"

[features]
fb = ["sapling-configloader/fb"]
